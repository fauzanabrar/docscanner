services:
  docscanner:
    build: .
    container_name: docscanner
    restart: unless-stopped
    ports:
      - "3002:3000"
    volumes:
      - docscanner-data:/data/docscanner
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-change-this-secret}
      - UPLOAD_DIR=/data/docscanner/uploads
      - DB_PATH=/data/docscanner/db.sqlite
      - TRANSFORMERS_CACHE=/data/docscanner/cache
      # ORT_NUM_THREADS=2  # Uncomment and lower on small ARM CPUs (default: all cores)
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)throw 1}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  docscanner-data:
